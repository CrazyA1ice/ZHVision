name: Python tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Python files
        run: python -m compileall -q app.py core.py taxonomy.py tests
      - name: Verify imports
        run: python -c "import app, core, taxonomy"
      - name: Run tests
        run: python -m pytest -q
